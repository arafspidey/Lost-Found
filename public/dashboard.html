<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My dashboard - Lost &amp; Found</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main class="wrap">
    <h1>My dashboard</h1>
    <div id="message"></div>

    <section class="block">
      <h2>Items I found</h2>
      <div id="foundList" class="stack"></div>
    </section>

    <section class="block">
      <h2>Items I am trying to claim</h2>
      <div id="claimedList" class="stack"></div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
